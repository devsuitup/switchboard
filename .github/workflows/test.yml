name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    # Separate job, not an npm pre-hook: `npm run coverage` (below) has no
    # `precoverage`, so `pretest` never fired for it and lint silently never
    # ran in CI. A dedicated job can't be skipped by a future script rename —
    # it shows up as its own entry in the checks list.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  changelog:
    # see docs/changelog.md ("The CI check")
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a CHANGELOG.md entry for app changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-changelog.js --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"

  e2e:
    # see docs/e2e.md
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs electron-builder install-app-deps, which builds the
      # native modules for Electron's ABI; it swallows a failure, so check.
      - name: Install dependencies
        run: npm ci

      - name: Check the native modules load under Electron
        run: ELECTRON_RUN_AS_NODE=1 npx electron -e "require('better-sqlite3'); require('node-pty')"

      - name: Install xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Build the CodeMirror bundle
        run: npm run bundle:codemirror

      - name: Run the journeys
        env:
          CI: "true"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run e2e

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            ${{ runner.temp }}/switchboard-e2e-results/
            e2e/playwright-report/
          retention-days: 14

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
        os: [ubuntu-latest, windows-2022]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # diff-cover needs history to compare against the base branch
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The sandbox tests that write from inside a real bwrap skip where
      # unprivileged user namespaces are refused; on Linux they must run.
      - name: Enable the real-sandbox tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "SWITCHBOARD_REQUIRE_REAL_BWRAP=1" >> "$GITHUB_ENV"

      - name: Run tests with coverage
        run: npm run coverage

      # Gate only NEW/changed lines (patch coverage), not the whole codebase:
      # main.js (Electron IPC/native) and the DOM glue cannot be unit-tested, so
      # a global threshold is meaningless. Runs once (Node 22 on ubuntu-latest)
      # on PRs only — os is pinned here too, or the windows-2022 leg would run
      # the same gate a second time with a different lcov path style.
      - name: Patch coverage gate (changed lines >= 80%)
        if: matrix.node-version == 22 && matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        run: |
          python -m pip install --quiet diff_cover
          git fetch origin "${{ github.base_ref }}" --quiet
          diff-cover coverage/lcov.info \
            --compare-branch "origin/${{ github.base_ref }}" \
            --fail-under 80 \
            --exclude 'main.js' 'preload.js' 'mcp-bridge.js' 'claude-auth.js' \
                      'public/codemirror-bundle.js' 'public/codemirror-setup.js' \
                      'public/terminal-manager.js' 'public/app.js' \
                      'workers/**' 'scripts/**' 'test/**' 'e2e/**'
