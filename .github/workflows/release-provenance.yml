name: Release provenance

on:
  pull_request:
    branches: ['release/*']

permissions:
  contents: read

concurrency:
  group: release-provenance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch main and release branches
        run: git fetch --no-tags --prune origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/release/*:refs/remotes/origin/release/*'

      - name: Extract the checker from main
        run: git show origin/main:scripts/check-release-provenance.js > "$RUNNER_TEMP/check-release-provenance.js"

      - name: Check every incoming commit
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node "$RUNNER_TEMP/check-release-provenance.js" pr "$BASE_BRANCH" "$HEAD_SHA"
