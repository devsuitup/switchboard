name: Flake loop (temporary)

on:
  pull_request:
    branches: [main]

jobs:
  loop:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
        variant: [before, after]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Restore the runners from main
        if: matrix.variant == 'before'
        shell: pwsh
        run: |
          git fetch origin main --depth=1
          git checkout FETCH_HEAD -- git-changes-file.js git-changes-runner.js
          git status --short
      - name: Run the blob-over-the-cap subtest repeatedly, four at a time
        shell: pwsh
        run: |
          (Get-Command git).Source
          node scripts/diag-loop.js 1500 4

  diag:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Does a killed git leave a git.exe behind
        shell: pwsh
        run: node scripts/diag-orphan.js
