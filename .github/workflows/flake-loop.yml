name: Flake loop (temporary)

on:
  pull_request:
    branches: [main]

jobs:
  loop:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Run the blob-over-the-cap subtest repeatedly
        shell: pwsh
        run: |
          Get-Command git -All | ForEach-Object { "git candidate: $($_.Source)" }
          $runs = 200; $fail = 0; $ebusy = 0
          for ($i = 1; $i -le $runs; $i++) {
            $out = node --test --test-name-pattern="blob over the cap" test/git-changes-file-real-git.test.js 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) {
              $fail++
              if ($out -match 'EBUSY') { $ebusy++ }
              ($out -split "`n") | Select-String -Pattern 'not ok|EBUSY' | Select-Object -First 5 | ForEach-Object { $_.Line }
            }
          }
          "RESULT node=${{ matrix.node-version }} shard=${{ matrix.shard }} runs=$runs failed=$fail ebusy=$ebusy"

  diag:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
        blob: [4096, 8388608]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Observe git processes after a capped read
        shell: pwsh
        run: node scripts/diag-capped-read.js 100 ${{ matrix.blob }}
